[package]
name = "feldbuch-nt"
version = "0.2.2"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
roxmltree = "0.20.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
sha2 = "0.11.1"
ttf-parser = "0.25.1"
ureq = "3.5.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.34"
